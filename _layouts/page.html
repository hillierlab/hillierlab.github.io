<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title }} | {{ site.title }}</title>

<link rel="preload" as="image" href="/assets/images/h_brain.png" />

<script>
(function () {
  document.documentElement.classList.add('prep');
  if (sessionStorage.getItem('hl_unlocked') === '1') {
    document.documentElement.classList.add('happy', 'no-anim');
    document.documentElement.style.background = '#fff';
    document.documentElement.style.color = '#000';
  } else {
    document.documentElement.style.background = '#000';
    document.documentElement.style.color = '#e0e0e0';
  }
})();
</script>

<style>
/* =========================================
   1. GLOBAL & DESKTOP STYLES
   ========================================= */
html, body {
  background: #000; color: #e0e0e0;
}
body {
  font-family: "Georgia", serif;
  margin: 0;
  /* Standard Desktop Padding */
  padding-top: 80px;
  line-height: 1.6;
  text-align: center;
  transition: background-color 1.2s ease, color 1.2s ease;
}

/* Hide body for the very first frame to prevent flashes */
html.prep body { visibility: hidden; }
/* Disable transitions on first paint if we arrived unlocked */
html.no-anim, html.no-anim * { transition: none !important; }

/* NAVBAR */
nav {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 60px;
  background: #000; color: #fff;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 2.5rem; border-bottom: 2px solid #fff; z-index: 10;
  transition: background-color 1.2s ease, color 1.2s ease, border-color 1.2s ease;
  box-sizing: border-box; /* Important for padding calculations */
}
nav .brand {
  font-weight: bold; font-size: 1.25rem;
  transform: scale(1.25); transform-origin: left center;
  text-decoration: none; color: inherit;
  padding: 8px 14px; border-radius: 4px;
  transition: all 0.3s ease;
}
nav .brand:hover { background: #fff; color: #000; }

/* NAV LINKS */
.nav-links {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 1rem;
  flex-grow: 1;
  margin-left: 2rem;
  padding-right: calc(1.5rem + 38px);
  box-sizing: border-box;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 6px;
  border: 2px solid transparent;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  white-space: nowrap;
}

/* Hover background & Themes */
html:not(.happy) .nav-links a:hover { background: #fff; color: #000; }
html.happy .nav-links a:hover { background: #000; color: #fff; }
.nav-links a.active { border-color: currentColor; }
nav a:focus { outline: none !important; }

/* CONTENT */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem;
  text-align: left;
}
main img {
  display: block;
  max-width: 700px;
  width: 90%;
  margin: 2rem auto;
  border-radius: 10px;
}

/* HAPPY MODE (Light Theme) */
html.happy, html.happy body { background: #fff; color: #000; }
html.happy nav { background: #fff; color: #000; border-bottom: 2px solid #000; }
html.happy nav .brand:hover,
html.happy .nav-links a:hover { background: #000; color: #fff; }

/* =========================================
   2. MOBILE PORTRAIT (The fix for vertical phones)
   ========================================= */
@media screen and (max-width: 900px) and (orientation: portrait) {
  nav { 
    height: auto; 
    flex-direction: column; 
    padding: 5px 0; 
    gap: 2px; 
  }
  nav .brand { 
    font-size: 1.2rem; 
    transform: none; 
    padding: 4px 14px; 
  }
  
  .nav-links { 
    width: 100%; 
    margin: 0; 
    padding: 0; 
    justify-content: center; 
    flex-wrap: wrap; /* Allows links to stack onto multiple lines */
    gap: 4px; 
  }
  .nav-links a { 
    font-size: 0.8rem; 
    padding: 5px 8px; 
  }

  /* Increase body padding so content isn't hidden behind the taller navbar */
  body { padding-top: 130px; }
  main { padding: 1rem; }
}

/* =========================================
   3. MOBILE LANDSCAPE (The fix for horizontal phones)
   ========================================= */
@media screen and (max-height: 500px) {
  nav { padding: 0 10px; }
  nav .brand { transform: scale(1); font-size: 1rem; }
  
  .nav-links {
    flex-grow: 1;
    width: auto;
    margin-left: 10px;
    margin-right: 0; 
    
    justify-content: flex-start;
    overflow-x: auto; /* Enables Scrolling */
    white-space: nowrap;
    -webkit-overflow-scrolling: touch; 
    scrollbar-width: none;
    
    padding-right: 25px; /* Ensures the last link isn't cut off */
  }
  .nav-links::-webkit-scrollbar { display: none; }
  
  .nav-links a { 
    font-size: 0.7rem; 
    padding: 3px 6px; 
    flex-shrink: 0; 
    border-width: 1px; 
  }   
  
  /* Reset body padding for landscape */
  body { padding-top: 60px; }
  main { padding-top: 10px; } 
}
</style>
</head>

<body>
<nav>
  <a href="/" class="brand">HillierLab</a>
  <div class="nav-links">
    <a href="/vision"
       class="{% if page.url contains '/vision' %}active{% endif %}">
      Vision
    </a>

    <a href="/research"
       class="{% if page.url contains '/research' %}active{% endif %}">
      Research
    </a>

    <a href="/patients-teachers-students"
       class="{% if page.url contains '/patients-teachers-students' %}active{% endif %}">
      Patients, Teachers, Students
    </a>

    <a href="/team"
       class="{% if page.url contains '/team' %}active{% endif %}">
      Team
    </a>

    <a href="/collaborations"
       class="{% if page.url contains '/collaborations' %}active{% endif %}">
      Collaborations
    </a>

    <a href="/news-publications"
       class="{% if page.url contains '/news-publications' %}active{% endif %}">
      News & Publications
    </a>

    <a href="/unscrambly"
       class="{% if page.url contains '/unscrambly' %}active{% endif %}">
      Unscrambly
    </a>
    
    <a href="/contact"
       class="{% if page.url contains '/contact' %}active{% endif %}">
      Contact
    </a>

  
  </div>
</nav>

<main>
  <h1>{{ page.title }}</h1>
  {{ content }}
</main>

<script>
// If unlocked, ensure body picks up any body-specific styles
if (sessionStorage.getItem('hl_unlocked') === '1') {
  document.documentElement.classList.add('happy');
}

// Reveal after first frame
requestAnimationFrame(() => {
  document.documentElement.classList.remove('prep', 'no-anim');
  document.documentElement.style.background = '';
  document.documentElement.style.color = '';
});
</script>

</body>
</html>
