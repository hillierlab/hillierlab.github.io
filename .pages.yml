media:
  input: assets/images
  output: /assets/images

content:
  - name: pages
    label: Pages
    path: .                 # Scan the root folder
    type: collection
    filename: '{slug}.md'   # <--- FIX: Tells CMS to look for "name.md" instead of dates
    exclude:                # <--- FIX: Hides system files from the editor
      - README.md
      - LICENSE
      - _config.yml
      - Gemfile
      - Gemfile.lock
    view:
      title: title
    fields:
      - name: slug
        label: Filename (Slug)
        type: string
        required: true
        pattern: '^[a-z0-9-_]+$' # Ensures filenames are web-safe
      - name: title
        label: Title
        type: string
        required: true
      - name: layout
        label: Layout
        type: string
        default: page
        hidden: true
      - name: body
        label: Body
        type: rich-text
